name: Haiity
options:
  bundleIdPrefix: com.aiity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Deutsche Quellstrings -> Katalog-Extraktion beim Build (aiity-Muster).
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Haiity:
    type: application
    platform: iOS
    sources:
      - path: Haiity
        # Explizit unten eingehängt, damit App und Widget nachweislich
        # DASSELBE Manifest bekommen (Apple prüft jedes Bundle einzeln).
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Haiity/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Die Widget-OBERFLÄCHEN und ihre reine Logik liegen auch im App-Target,
      # damit die Rendering-Prüfung (jede Familie × Datenlage × Rendermodus)
      # ohne Widget-Prozess läuft und die Unit-Tests die Rechnungen sehen.
      # Bundle, Provider und das Steuerungselement bleiben Extension-only.
      - path: HaiityWidget/WidgetLogic.swift
      - path: HaiityWidget/WidgetGridViews.swift
      - path: HaiityWidget/HaiityWidgetView.swift
      - path: HaiityWidget/GraphWidgetView.swift
      - path: HaiityWidget/GitHubWidgetGraph.swift
      - path: HaiityWidget/RosterWidgetView.swift
      - path: HaiityWidget/AccessoryWidgetViews.swift
    dependencies:
      - target: HaiityWidget
    info:
      path: Haiity/Info.plist
      properties:
        CFBundleDisplayName: hAiity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # ASC liest den TOP-LEVEL-Key für das Build-Icon (aiity-Lektion:
        # actool injiziert nur die verschachtelte CFBundleIcons-Variante).
        CFBundleIconName: AppIcon
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations:
          - de
          - en
          - es
          - fr
          - pt
          - it
          - zh-Hans
          - ja
          - ru
          - ar
          - hi
          - bn
          - ur
          - id
          - tr
          - vi
          - ko
        GitHubClientID: $(GITHUB_CLIENT_ID)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchTiles
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.aiity.haiity.github-refresh
        # Kalender: eigener hAiity-Kalender; Vollzugriff, weil Pflegen
        # (Aktualisieren/Entfernen eigener Termine) ein Lesen voraussetzt.
        NSCalendarsFullAccessUsageDescription: "hAiity legt einen eigenen Kalender an und pflegt darin die Termine deiner Habits. Deine übrigen Kalender und Termine bleiben unberührt."
        NSRemindersFullAccessUsageDescription: "hAiity synchronisiert deine eigenen Erinnerungen mit der Apple Erinnerungen-App."
        # Sprachknopf: nur der Satz, aus dem ein neues Habit entsteht. Der Text
        # sagt bewusst NICHTS darueber, wohin die Audiodaten gehen — ueber dem
        # Prompt steht Apples eigener Satz, und ihm zu widersprechen waere eine
        # falsche Zusage. Die App sendet selbst nichts weiter; ob und wie Apple
        # die Erkennung verarbeitet, steht in Apples Dialog.
        NSMicrophoneUsageDescription: "hAiity hört nur zu, während du den Satz aufnimmst, aus dem ein neues Habit entstehen soll. Die Aufnahme startet nur, wenn du den Knopf drückst, und endet, sobald du ihn erneut drückst."
        NSSpeechRecognitionUsageDescription: "hAiity schreibt deinen aufgenommenen Satz in Text um, damit daraus ein Habit oder eine Erinnerung wird. Die Aufnahme endet, sobald du den Knopf erneut drückst."
        # Live-Aktivitäten (Habit-Sessions) — muss in App UND Extension stehen.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.aiity.haiity
            CFBundleURLSchemes: [haiity]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiity.haiity
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternative Icons je Palette. Der Katalog-Weg (statt loser PNGs im
        # Bundle) ist seit Xcode 13 der unterstützte: actool schreibt
        # CFBundleAlternateIcons selbst ins Info.plist und legt die Bilder in
        # die Assets.car. Namen MÜSSEN mit AppIcons.name(for:) übereinstimmen
        # — dafür gibt es einen Test.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Blue AppIcon-Violet AppIcon-Amber AppIcon-Rose AppIcon-Gray AppIcon-H000 AppIcon-H030 AppIcon-H060 AppIcon-H090 AppIcon-H120 AppIcon-H150 AppIcon-H180 AppIcon-H210 AppIcon-H240 AppIcon-H270 AppIcon-H300 AppIcon-H330"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CURRENT_PROJECT_VERSION: 252
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_ENTITLEMENTS: Haiity/Haiity.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8FW6W6K2D
        # Public GitHub OAuth client ID only. Device Flow, no secret.
        GITHUB_CLIENT_ID: Ov23liK8SQEaJBHtzNjJ
  HaiityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HaiityWidget
      - path: Haiity/Models/Habit.swift
      - path: Haiity/Models/HabitTimeZone.swift
      # Die Wiederholungsregel hängt an Habit — ohne sie kompiliert das
      # geteilte Modell in der Extension nicht.
      - path: Haiity/Models/Recurrence.swift
      - path: Haiity/Models/ReminderOccurrence.swift
      - path: Haiity/Models/GoalEngine.swift
      - path: Haiity/Models/ScheduledProgress.swift
      - path: Haiity/Models/GridCalendar.swift
      - path: Haiity/Models/GitHubContributionModels.swift
      - path: Haiity/Models/GitHubWidgetSupport.swift
      - path: Haiity/Models/GitHubPreferences.swift
      - path: Haiity/Models/HabitStore.swift
      - path: Haiity/Models/StatsCardPrefs.swift
      # Die Regel als Satz: das Widget sagt „Frei bis Mo", wenn heute kein
      # Termin ist — dafür braucht es die Wochentagsnamen der App.
      - path: Haiity/Models/RecurrenceText.swift
      # Interaction.swift stand hier einmal, weil HabitData die
      # Wischgesten-Einstellung trug. Die Gesten sind weg, HabitData braucht
      # den Typ nicht mehr — und der Rest der Datei (Rückgängig-Toast) ist
      # reine Oberfläche, die es in der Extension nicht gibt.
      # Farben: die eingebauten Familien, die eigenen Paletten des Nutzers und
      # der Generator, der aus einer Grundfarbe die Rampe rechnet. Das Widget
      # zeichnet dieselben Zellen und braucht deshalb dieselbe Rechnung.
      - path: Haiity/Models/Palette.swift
      - path: Haiity/Models/PaletteGenerator.swift
      # Widget-Button braucht den Intent-TYP; perform() läuft im
      # Extension-Prozess und schreibt über den geteilten Store.
      # (HaiityShortcuts.swift bleibt bewusst App-only.)
      - path: Haiity/Intents/CheckOffHabitIntent.swift
      # perform() gleicht seit v16 auch die Mitteilungen ab (heutigen
      # Habit-Weckruf löschen, Tagesmeldung neu stellen) — sonst klingelt
      # nach einem Widget-Check-in die Erinnerung für ein erledigtes Habit.
      # Reminders zieht SummaryText (den Text der Tagesmeldung) mit herein.
      - path: Haiity/Services/Reminders.swift
      - path: Haiity/Models/SummaryText.swift
      # Der Glückwunsch zum perfekten Tag kann auch vom Widget-Check-in
      # ausgelöst werden — Botschaft (Celebration) und Anrede (PersonalName)
      # müssen deshalb im Extension-Prozess vorliegen.
      - path: Haiity/Models/Celebration.swift
      - path: Haiity/Models/PersonalName.swift
      # Aus demselben Grund der Motivationsvorrat: Reminders.reschedule
      # plant die Tagesnachrichten und wird aus dieser Extension heraus
      # übersetzt — ohne die Datei fehlt hier schlicht der Typ.
      - path: Haiity/Models/Motivation.swift
      # `Reminders.reschedule` runs in this extension too, and it now asks
      # `MotivationDaily` for the day's line before building the notification.
      # The retired network feed is gone; these three replace it, and the writer
      # is iOS 26-gated inside so the extension still builds for iOS 17.
      - path: Haiity/Models/GeneratedMotivation.swift
      - path: Haiity/Models/OnDeviceModel.swift
      - path: Haiity/Services/MotivationWriter.swift
      # Live-Aktivität: geteilter Attribut-Typ, Session-Logik/Ablage und die
      # Intents der Knöpfe — die Extension braucht die TYPEN, perform()
      # läuft im App-Prozess.
      - path: Haiity/Models/HabitSession.swift
      - path: Haiity/Models/HabitActivityAttributes.swift
      - path: Haiity/Intents/HabitSessionIntents.swift
      # The motivation activity uses the same shared attributes and dismiss
      # intent in the widget extension as the app uses in its manager.
      - path: Haiity/Models/MotivationActivity.swift
      - path: Haiity/Intents/MotivationActivityIntents.swift
      # Die Widget-Konfiguration (welcher Habit steht in DIESER Instanz) —
      # greift auf dieselbe HabitEntity und dieselbe Query zurück.
      - path: Haiity/Intents/SelectHabitIntent.swift
      - path: Haiity/Intents/SelectGraphIntent.swift
      - path: Haiity/Intents/SelectGitHubWidgetIntent.swift
      - path: Haiity/Intents/LargeWidgetIntent.swift
      - path: Haiity/Intents/GraphPaletteEntity.swift
      - path: Haiity/Views/GitHubContributionGraph.swift
      - path: Haiity/Theme.swift
      # Ohne den Katalog IM Extension-Bundle fallen alle Widget-Strings auf
      # Deutsch zurück: in einer Extension ist Bundle.main die .appex, nicht
      # die App — die 16 .lproj liegen sonst nur in Haiity.app.
      - path: Haiity/Localizable.xcstrings
      # Auch die Extension ist ein eigenes Bundle und braucht das Manifest.
      - path: Haiity/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: HaiityWidget/Info.plist
      properties:
        CFBundleDisplayName: hAiity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        # Wie die App: Deutsch ist die Entwicklungssprache. Ohne die Angabe
        # fällt ein Schlüssel, der in de.lproj fehlt (Quellsprache), auf die
        # NÄCHSTE Nutzersprache statt auf die deutsche Quelle zurück — auf
        # einem Gerät mit de+zh stand auf der Live-Aktivität plötzlich 完成.
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations:
          - de
          - en
          - es
          - fr
          - pt
          - it
          - zh-Hans
          - ja
          - ru
          - ar
          - hi
          - bn
          - ur
          - id
          - tr
          - vi
          - ko
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiity.haiity.widget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 252
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_ENTITLEMENTS: HaiityWidget/HaiityWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8FW6W6K2D
        SKIP_INSTALL: true
  HaiityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HaiityTests
    postBuildScripts:
      - name: Bundle source contract fixtures
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          bundle="$TARGET_BUILD_DIR/$WRAPPER_NAME"
          mkdir -p "$bundle"
          cp "$PROJECT_DIR/Haiity/Services/CalendarSync.swift" "$bundle/CalendarSync.txt"
          cp "$PROJECT_DIR/Haiity/Services/CalendarEventKit.swift" "$bundle/CalendarEventKit.txt"
          cp "$PROJECT_DIR/Haiity/Services/ReminderSync.swift" "$bundle/ReminderSync.txt"
          cp "$PROJECT_DIR/Haiity/Views/ContentView.swift" "$bundle/ContentView.txt"
          cp "$PROJECT_DIR/Haiity/Views/EditHabitSheet.swift" "$bundle/EditHabitSheet.txt"
          cp "$PROJECT_DIR/Haiity/Views/HabitCard.swift" "$bundle/HabitCard.txt"
          cp "$PROJECT_DIR/Haiity/Views/MoreView.swift" "$bundle/MoreView.txt"
          cp "$PROJECT_DIR/Haiity/Views/ReminderRow.swift" "$bundle/ReminderRow.txt"
          cp "$PROJECT_DIR/Haiity/Views/SwipeRevealPan.swift" "$bundle/SwipeRevealPan.txt"
          cp "$PROJECT_DIR/Haiity/Localizable.xcstrings" "$bundle/Localizable.txt"
    dependencies:
      - target: Haiity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiity.haiity.tests
        SWIFT_VERSION: "5.9"
        # Test-Bundle ohne eigenes Info.plist — Xcode generiert eins.
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8FW6W6K2D
  HaiityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HaiityUITests]
    dependencies:
      - target: Haiity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiity.haiity.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8FW6W6K2D
schemes:
  Haiity:
    build:
      targets:
        Haiity: all
    run:
      config: Debug
      # Käufe im Simulator ohne App Store Connect. Die Datei liegt bewusst
      # NEBEN dem Ordner Haiity/: „sources: - path: Haiity" zieht alles ein,
      # was darunter liegt — eine .storekit dort landete als Ressource im
      # ausgelieferten Bundle. Sie gehört zum SCHEMA, nicht zum Produkt.
      storeKitConfiguration: Haiity.storekit
    test:
      config: Debug
      targets:
        - HaiityTests
        - HaiityUITests
