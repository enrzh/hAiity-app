name: Haiity
options:
  bundleIdPrefix: com.aiity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Deutsche Quellstrings -> Katalog-Extraktion beim Build (aiity-Muster).
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Haiity:
    type: application
    platform: iOS
    sources:
      - path: Haiity
        # Explizit unten eingehängt, damit App und Widget nachweislich
        # DASSELBE Manifest bekommen (Apple prüft jedes Bundle einzeln).
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Haiity/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Die Widget-OBERFLÄCHE liegt auch im App-Target, damit die
      # Rendering-Prüfung (klein/mittel × Datenlagen) ohne Widget-Prozess
      # läuft. Bundle/Provider bleiben Extension-only.
      - path: HaiityWidget/HaiityWidgetView.swift
    dependencies:
      - target: HaiityWidget
    info:
      path: Haiity/Info.plist
      properties:
        CFBundleDisplayName: hAiity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # ASC liest den TOP-LEVEL-Key für das Build-Icon (aiity-Lektion:
        # actool injiziert nur die verschachtelte CFBundleIcons-Variante).
        CFBundleIconName: AppIcon
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations:
          - de
          - en
          - es
          - fr
          - pt
          - it
          - zh-Hans
          - ja
          - ru
          - ar
          - hi
          - bn
          - ur
          - id
          - tr
          - vi
          - ko
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.aiity.haiity
            CFBundleURLSchemes: [haiity]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiity.haiity
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternative Icons je Palette. Der Katalog-Weg (statt loser PNGs im
        # Bundle) ist seit Xcode 13 der unterstützte: actool schreibt
        # CFBundleAlternateIcons selbst ins Info.plist und legt die Bilder in
        # die Assets.car. Namen MÜSSEN mit AppIcons.name(for:) übereinstimmen
        # — dafür gibt es einen Test.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Blue AppIcon-Violet AppIcon-Amber AppIcon-Rose AppIcon-Gray"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_ENTITLEMENTS: Haiity/Haiity.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8FW6W6K2D
  HaiityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HaiityWidget
      - path: Haiity/Models/Habit.swift
      - path: Haiity/Models/GoalEngine.swift
      - path: Haiity/Models/GridCalendar.swift
      - path: Haiity/Models/HabitStore.swift
      # Widget-Button braucht den Intent-TYP; perform() läuft im
      # Extension-Prozess und schreibt über den geteilten Store.
      # (HaiityShortcuts.swift bleibt bewusst App-only.)
      - path: Haiity/Intents/CheckOffHabitIntent.swift
      - path: Haiity/Theme.swift
      # Ohne den Katalog IM Extension-Bundle fallen alle Widget-Strings auf
      # Deutsch zurück: in einer Extension ist Bundle.main die .appex, nicht
      # die App — die 16 .lproj liegen sonst nur in Haiity.app.
      - path: Haiity/Localizable.xcstrings
      # Auch die Extension ist ein eigenes Bundle und braucht das Manifest.
      - path: Haiity/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: HaiityWidget/Info.plist
      properties:
        CFBundleDisplayName: hAiity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiity.haiity.widget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_ENTITLEMENTS: HaiityWidget/HaiityWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8FW6W6K2D
        SKIP_INSTALL: true
  HaiityTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HaiityTests]
    dependencies:
      - target: Haiity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiity.haiity.tests
        SWIFT_VERSION: "5.9"
        # Test-Bundle ohne eigenes Info.plist — Xcode generiert eins.
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Haiity:
    build:
      targets:
        Haiity: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HaiityTests
